spring.config.import=optional:file:./application-local.properties
spring.application.name=servicio-foro
usuarios.base-url=${USUARIOS_URL:http://localhost:8081}
server.port=${FORO_PORT:8082}
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_SERVICE:}?TNS_ADMIN=${TNS_ADMIN:}
spring.datasource.username=${ORACLE_USERNAME:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${TNS_ADMIN:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
